name: flutter_music
description: 本地音乐播放器 - 支持自定义扫描目录、封面显示、LRC 歌词滚动
publish_to: 'none'
version: 0.3.48

environment:
  sdk: '>=3.13.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: 6.1.5+1
  shared_preferences: 2.5.6
  path_provider: 2.1.6
  path: 1.9.1
  just_audio: 0.10.6
  just_audio_windows: 0.2.3
  audio_service: 0.18.19
  audio_session: 0.2.4
  audio_metadata_reader: 1.8.1
  file_picker: 13.1.0
  permission_handler: 13.0.2
  window_manager: 0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
