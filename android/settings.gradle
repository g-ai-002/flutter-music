pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        if (System.getenv('USE_ALIYUN_MAVEN') == 'true') {
            maven { url 'https://maven.aliyun.com/repository/google' }
            maven { url 'https://maven.aliyun.com/repository/public' }
            maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }

            // 2. 腾讯云 (备选，阿里没有时这里找)
            maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-google/' }
            maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-central/' }

            // 3. 华为云 (再备选)
            maven { url 'https://repo.huaweicloud.com/repository/maven/google/' }
            maven { url 'https://repo.huaweicloud.com/repository/maven/central/' }
        }
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "9.2.1" apply false
    id "org.jetbrains.kotlin.android" version "2.3.21" apply false
}

rootProject.name = 'flutter_music'
include ':app'
