pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        if (System.getenv('USE_ALIYUN_MAVEN') == 'true') {
            // 1. Maven Central 镜像 (Kotlin artifact 主源，避免 fallback 到 dl.google.com 触发 429)
            maven { url 'https://maven.aliyun.com/repository/public' }
            maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-central/' }
            maven { url 'https://repo.huaweicloud.com/repository/maven/central/' }
            // 2. Google Maven 镜像 (AndroidX 等)
            maven { url 'https://maven.aliyun.com/repository/google' }
            maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-google/' }
            maven { url 'https://repo.huaweicloud.com/repository/maven/google/' }
            // 3. Gradle Plugin Portal 镜像
            maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
            maven { url 'https://mirrors.cloud.tencent.com/gradle-plugins/' }
        }
        mavenCentral()
        google()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "9.2.1" apply false
    id "org.jetbrains.kotlin.android" version "2.3.21" apply false
}

rootProject.name = 'flutter_music'
include ':app'
